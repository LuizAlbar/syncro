services:
  app:
    build:
      context: ..
      dockerfile: dev/Dockerfile.dev
    container_name: syncro_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=mongodb://mongodb:27017/syncro
      - MONGODB_URI=mongodb://mongodb:27017/syncro
      - JWT_SECRET=syncro_dev_secret_jwt_key_session_secure_2026
      - WATCHPACK_POLLING=true
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: syncro_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=syncro
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo_data:
    driver: local
